<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camera Control Explorer</title>
<style>
:root{--bg:#f4f2ed;--ink:#151817;--muted:#5b625f;--panel:#fff;--line:#d9d4c9;--accent:#0f766e;--mark:#f2b544;--danger:#b42318}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.app-shell{display:grid;grid-template-columns:minmax(0,1fr)320px;gap:18px;min-height:100vh;padding:18px}.camera-stage,.control-panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 32px rgba(20,24,23,.08);overflow:hidden}.camera-stage{display:flex;flex-direction:column;min-width:0}.stage-header,.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}.panel-heading{display:block}.eyebrow{margin:0 0 4px;color:var(--accent);font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h1,h2{margin:0;line-height:1.1;letter-spacing:0}h1{font-size:clamp(1.25rem,2vw,1.9rem)}h2{font-size:1.08rem}.ghost-button{min-width:70px;min-height:38px;border:1px solid var(--line);border-radius:6px;background:#fbfaf7;color:var(--ink);cursor:pointer}.camera-wrap{flex:1;display:grid;grid-template-rows:minmax(0,1fr) auto;align-items:center;justify-items:center;gap:14px;min-height:0;padding:18px;background:linear-gradient(90deg,rgba(15,118,110,.06) 1px,transparent 1px),linear-gradient(rgba(15,118,110,.06) 1px,transparent 1px),#f8f7f3;background-size:36px 36px}.camera-frame{position:relative;width:min(100%,948px);min-width:0}.camera-image{display:block;width:100%;height:auto;object-fit:contain;user-select:none}.hotspot-layer{position:absolute;inset:0;pointer-events:none}.hotspot{position:absolute;min-width:26px;min-height:26px;border:2px solid rgba(242,181,68,.95);border-radius:999px;background:rgba(242,181,68,.18);cursor:pointer;pointer-events:auto;transition:.16s}.hotspot:after{content:attr(data-index);position:absolute;left:50%;top:50%;display:grid;place-items:center;width:22px;height:22px;border-radius:999px;background:var(--mark);color:#12110e;font-size:.72rem;font-weight:800;transform:translate(-50%,-50%);box-shadow:0 6px 14px rgba(20,24,23,.18)}.hotspot.rect{border-radius:8px}.hotspot.small:after{width:18px;height:18px;font-size:.66rem}.hotspot:hover,.hotspot:focus-visible,.hotspot.active{border-color:var(--accent);background:rgba(15,118,110,.22);box-shadow:0 0 0 6px rgba(15,118,110,.18);outline:none;transform:scale(1.03)}.hotspot.active:after{background:var(--accent);color:#fff}.callout{position:static;width:min(760px,100%);padding:18px;border:1px solid rgba(15,118,110,.28);border-radius:8px;background:#fff;box-shadow:0 12px 28px rgba(20,24,23,.1)}.callout-kicker{margin:0 0 6px;color:var(--danger);font-size:.76rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.callout h2{margin-bottom:8px;font-size:clamp(1.1rem,1.9vw,1.45rem)}.callout p:last-child{margin:0;color:var(--muted);line-height:1.45}.control-panel{display:flex;flex-direction:column;min-height:0}.control-list{display:grid;gap:8px;overflow:auto;padding:12px}.control-card{display:grid;grid-template-columns:28px 1fr;gap:10px;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fbfaf7;color:var(--ink);text-align:left;cursor:pointer}.control-card:hover,.control-card:focus-visible,.control-card.active{border-color:var(--accent);outline:3px solid rgba(15,118,110,.16)}.control-number{display:grid;place-items:center;width:28px;height:28px;border-radius:999px;background:var(--accent);color:#fff;font-size:.78rem;font-weight:800}.control-card h3{margin:0 0 3px;font-size:.94rem}.control-card p{margin:0;color:var(--muted);font-size:.82rem;line-height:1.35}@media(max-width:980px){.app-shell{grid-template-columns:1fr;height:auto}.control-panel{max-height:none}}@media(max-width:680px){.app-shell{padding:10px}.stage-header,.panel-heading{padding:14px}.camera-wrap{padding:10px}.callout{width:100%}}
</style>
</head>
<body>
<main class="app-shell">
<section class="camera-stage" aria-label="Interactive camera back"><div class="stage-header"><div><p class="eyebrow">Film / Photography</p><h1>Camera Control Explorer</h1></div><button class="ghost-button" id="clearSelection" type="button">Clear</button></div><div class="camera-wrap"><div class="camera-frame"><img src="camera-back.svg" alt="Back view of a DSLR camera with clickable controls" class="camera-image"><div class="hotspot-layer" id="hotspotLayer" aria-label="Camera control hotspots"></div></div><aside class="callout" id="callout" aria-live="polite"><p class="callout-kicker" id="calloutKicker">Select an area</p><h2 id="calloutTitle">Camera Back</h2><p id="calloutText">Choose a highlighted control to reveal its name and what it is used for.</p></aside></div></section>
<section class="control-panel" aria-label="Camera control list"><div class="panel-heading"><p class="eyebrow">Reference</p><h2>Controls On This View</h2></div><div class="control-list" id="controlList"></div></section>
</main>
<script>
const controls=[
{name:"Hot Shoe",role:"Accessory mount",detail:"Holds an external flash, wireless trigger, or other compatible camera accessory.",x:37.4,y:3.7,w:15.2,h:5.8,shape:"rect"},
{name:"Optical Viewfinder",role:"Compose and focus",detail:"Lets the photographer look through the lens to frame the shot and check focus information.",x:30.1,y:17.2,w:28.1,h:22.5,shape:"rect"},
{name:"Main Dial",role:"Change settings",detail:"Scrolls through values such as shutter speed, aperture, menu choices, and playback options.",x:66.1,y:18.2,w:17.2,h:9.3,shape:"rect"},
{name:"Live View / Movie Button",role:"Switch viewing mode",detail:"Turns on the rear screen for live view, or starts and stops video on many DSLR models.",x:61,y:30.7,w:6.3,h:8.3},
{name:"AE Lock / Zoom Out",role:"Lock exposure",detail:"Locks the current exposure reading while shooting; in playback it usually zooms out or shows thumbnails.",x:83.1,y:31.6,w:6,h:7.7},
{name:"AF Point / Zoom In",role:"Focus point control",detail:"Selects an autofocus point while shooting; in playback it usually zooms in for closer review.",x:90.1,y:32.1,w:5.6,h:7.1},
{name:"LCD Monitor",role:"Review and menus",detail:"Shows photos, menus, camera settings, and live view when the rear screen is active.",x:15.2,y:46,w:42,h:41.6,shape:"rect"},
{name:"Av / Exposure Compensation",role:"Adjust brightness",detail:"Changes aperture in Av mode or shifts exposure brighter or darker when used with the dial.",x:65,y:47.8,w:6,h:7.8,shape:"rect"},
{name:"Delete Button",role:"Remove media",detail:"Deletes the selected photo or video during playback after confirmation.",x:65,y:56.4,w:6,h:7.8,shape:"rect"},
{name:"Quick Control",role:"Open fast settings",detail:"Opens a shortcut screen for common settings without digging through the full menu.",x:62,y:58.5,w:3.7,h:5.4,size:"small"},
{name:"DISP Button",role:"Display options",detail:"Cycles through information shown on the rear screen, such as shooting data or a cleaner view.",x:78.4,y:56.4,w:7.4,h:8.3,shape:"rect"},
{name:"ISO Button",role:"Light sensitivity",detail:"Changes the sensor sensitivity. Higher ISO helps in low light but can add more image noise.",x:72,y:62.2,w:6.7,h:6.9},
{name:"Directional Pad",role:"Navigate and choose",detail:"Moves through menus and quick settings. The arrows may also open common camera settings.",x:66.3,y:63.8,w:19,h:22.7},
{name:"SET Button",role:"Confirm selection",detail:"Confirms menu choices, selected settings, and on-screen options.",x:72,y:69.8,w:7.1,h:9},
{name:"Drive / Self-Timer",role:"Shooting timing",detail:"Switches between single shot, continuous shooting, and self-timer options.",x:62,y:70.8,w:4.4,h:6.9,size:"small"},
{name:"MENU Button",role:"Full camera menu",detail:"Opens the full settings menu for image quality, formatting, playback, and camera setup.",x:65,y:83,w:5.8,h:8.1,shape:"rect"},
{name:"White Balance",role:"Control color",detail:"Changes how the camera interprets color temperature so whites look neutral in different lighting.",x:72.1,y:81.7,w:7,h:7.4},
{name:"AF Button",role:"Autofocus mode",detail:"Changes how the camera focuses, such as one-shot focus for still subjects or continuous focus for movement.",x:81.9,y:69.6,w:5.5,h:11},
{name:"Playback Button",role:"Review media",detail:"Shows captured photos and videos on the rear screen.",x:78.5,y:83,w:7.2,h:8,shape:"rect"},
{name:"Access Lamp",role:"Card activity",detail:"Lights up when the camera is writing to or reading from the memory card. Avoid removing the card while it is active.",x:88.9,y:87,w:2.2,h:3.6,size:"small"}
];
const hotspotLayer=document.querySelector("#hotspotLayer"),controlList=document.querySelector("#controlList"),calloutKicker=document.querySelector("#calloutKicker"),calloutTitle=document.querySelector("#calloutTitle"),calloutText=document.querySelector("#calloutText"),clearSelection=document.querySelector("#clearSelection");
function render(){controls.forEach((control,index)=>{const hotspot=document.createElement("button");hotspot.type="button";hotspot.className=["hotspot",control.shape==="rect"?"rect":"",control.size==="small"?"small":""].filter(Boolean).join(" ");hotspot.dataset.id=String(index);hotspot.dataset.index=String(index+1);hotspot.style.left=`${control.x}%`;hotspot.style.top=`${control.y}%`;hotspot.style.width=`${control.w}%`;hotspot.style.height=`${control.h}%`;hotspot.setAttribute("aria-label",`${control.name}: ${control.role}`);hotspot.addEventListener("click",()=>selectControl(index));hotspotLayer.appendChild(hotspot);const card=document.createElement("button");card.type="button";card.className="control-card";card.dataset.id=String(index);card.innerHTML=`<span class="control-number">${index+1}</span><span><h3>${control.name}</h3><p>${control.role}</p></span>`;card.addEventListener("click",()=>selectControl(index));controlList.appendChild(card)})}
function selectControl(index){const control=controls[index];calloutKicker.textContent=control.role;calloutTitle.textContent=control.name;calloutText.textContent=control.detail;document.querySelectorAll("[data-id]").forEach(item=>item.classList.toggle("active",Number(item.dataset.id)===index))}
function resetSelection(){calloutKicker.textContent="Select an area";calloutTitle.textContent="Camera Back";calloutText.textContent="Choose a highlighted control to reveal its name and what it is used for.";document.querySelectorAll("[data-id]").forEach(item=>item.classList.remove("active"))}
clearSelection.addEventListener("click",resetSelection);render();
</script>
</body>
</html>
